# Configuration complète de nginx pour le front (remplace celle de l'image).
# Conteneur en lecture seule : tout ce que nginx écrit va dans /tmp (tmpfs).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Pas de journal d'accès (ni IP ni adresse visitée) ; Traefik a le sien.
    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 1k;

    # La bannière « Recharger » compare l'ETag (ou Last-Modified) à celui du chargement.
    etag on;

    gzip on;
    gzip_types text/html;
    gzip_vary on;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # Derrière Traefik (HTTPS) : pas de redirection absolue vers http://…:8080.
        absolute_redirect off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        # L'aperçu YouTube (youtube-nocookie) exige un référent.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
        # Phase 1 : CSP en Report-Only (violations visibles dans la console, rien n'est bloqué).
        # À passer en Content-Security-Policy une fois la matrice de tests propre.
        #  - script : AudioWorklet en data:, worker de séparation en blob:, ONNX Runtime (wasm), Turnstile
        #  - connect : modèle Demucs sur Hugging Face (+ redirections *.hf.co), ONNX Runtime sur jsDelivr
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: data: https://cdn.jsdelivr.net https://challenges.cloudflare.com; worker-src 'self' blob:; connect-src 'self' blob: data: https://cdn.jsdelivr.net https://huggingface.co https://*.hf.co https://cas-bridge.xethub.hf.co; frame-src https://challenges.cloudflare.com https://www.youtube-nocookie.com; img-src 'self' data: blob: https://i.ytimg.com; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

        # Une seule page. « expires epoch » donne Cache-Control: no-cache (revalidation à chaque visite)
        # sans annuler les add_header du serveur.
        location = / {
            try_files /index.html =404;
            expires epoch;
        }
        location = /index.html {
            expires epoch;
        }

        # Tout le reste : 404 (lab/, docs/, DOC.md, .git, compose…, rien de cela n'est dans l'image).
        location / {
            return 404;
        }
    }
}
